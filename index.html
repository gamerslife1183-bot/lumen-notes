<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumen has moved</title>
<link rel="icon" href="https://lumenspaceapp.github.io/assets/logo.svg" type="image/svg+xml" />
<meta property="og:title" content="Lumen — notes, tasks & team workspace" />
<meta property="og:image" content="https://lumenspaceapp.github.io/assets/og-image.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light dark; }
  body { font-style: normal; margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #0d0e17; color: #eef; }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(40vmax 40vmax at 15% 10%, #7c5cff66, transparent), radial-gradient(40vmax 40vmax at 90% 90%, #ec489955, transparent); }
  .card { position: relative; width: min(440px, calc(100vw - 32px)); padding: 32px; border-radius: 24px; text-align: center; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(20px); box-shadow: 0 30px 80px -20px #000a; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 24px; margin: 14px 0 6px; } p { color: #c8c9da; line-height: 1.5; margin: 0 0 18px; }
  a.url { color: #c4b5fd; }
  button, .btn { display: block; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 0; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; text-decoration: none; }
  .primary { background: linear-gradient(135deg, #7c5cff, #ec4899); color: #fff; } .ghost { background: rgba(255,255,255,.1); color: #eef; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <img src="https://lumenspaceapp.github.io/assets/logo.svg" alt="Lumen" />
  <h1>Lumen has a new home</h1>
  <p id="msg">Lumen is now at <a class="url" href="https://lumenspaceapp.github.io/">lumenspaceapp.github.io</a>. Taking you there…</p>
  <div id="move" class="hidden">
    <button class="primary" id="go">Move my pages &amp; continue</button>
    <button class="ghost" id="skip">Just take me there</button>
  </div>
</div>
<script>
  // Old address → new address. Private-workspace pages live in this address's browser storage,
  // so if there are any, offer to hand them to the new address (it opens and receives them by postMessage).
  const NEW_ORIGIN = "https://lumenspaceapp.github.io";
  const next = location.search + location.hash;
  const target = NEW_ORIGIN + "/" + next;
  let keys = [];
  try { keys = Object.keys(localStorage).filter(k => k.startsWith("lumen-") && k !== "lumen-migrated"); } catch {}
  const migrated = (() => { try { return localStorage.getItem("lumen-migrated"); } catch { return null; } })();
  if (!keys.length || migrated) location.replace(target);
  else {
    document.getElementById("msg").innerHTML = 'Lumen moved to <a class="url" href="' + NEW_ORIGIN + '/">lumenspaceapp.github.io</a>. Your private pages are saved in this browser at the old address — bring them with you in one click.';
    document.getElementById("move").classList.remove("hidden");
    document.getElementById("skip").onclick = () => location.replace(target);
    document.getElementById("go").onclick = () => {
      const items = {}; keys.forEach(k => (items[k] = localStorage.getItem(k)));
      const w = window.open(NEW_ORIGIN + "/#/migrate", "_blank");
      if (!w) { alert("Please allow pop-ups for this page, then try again."); return; }
      addEventListener("message", e => {
        if (e.origin !== NEW_ORIGIN || !e.data) return;
        if (e.data.type === "lumen-ready") w.postMessage({ type: "lumen-data", items, next: next || "" }, NEW_ORIGIN);
        if (e.data.type === "lumen-done") {
          try { localStorage.setItem("lumen-migrated", "1"); } catch {}
          document.getElementById("msg").textContent = "✅ Done! Your pages are at the new address. You can close this tab.";
          document.getElementById("move").classList.add("hidden");
        }
      });
    };
  }
</script>
</body>
</html>
